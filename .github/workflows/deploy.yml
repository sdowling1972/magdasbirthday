name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT: magdasbirthday

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$PROJECT:latest"
          docker build --platform linux/amd64 -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Deploy App Runner
        run: |
          ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$PROJECT'].ServiceArn" --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "App Runner service not found yet"
            exit 1
          fi
          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.Status' --output text)
            echo "App Runner status: $STATUS ($i)"
            if [ "$STATUS" = "RUNNING" ]; then
              break
            fi
            sleep 15
          done
          STATUS=$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.Status' --output text)
          if [ "$STATUS" != "RUNNING" ]; then
            echo "App Runner not RUNNING after wait: $STATUS"
            exit 1
          fi
          aws apprunner start-deployment --service-arn "$ARN"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync frontend to S3
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT}-frontend-${ACCOUNT}"
          aws s3 sync frontend/dist "s3://$BUCKET" --delete
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='$PROJECT'].Id | [0]" --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi
